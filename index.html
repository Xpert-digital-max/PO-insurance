<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ระบบเสนอราคาเบี้ยประกัน</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
  <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
</head>
<body class="bg-gray-100 p-4 md:p-6">

  <div id="loading-section" class="max-w-md mx-auto mt-20 text-center">
    <div class="animate-spin rounded-full h-12 w-12 border-b-2 border-blue-600 mx-auto mb-4"></div>
    <p class="text-gray-600 font-semibold" id="loading-text">กำลังโหลดข้อมูลระบบ...</p>
  </div>

  <div id="app-section" class="hidden max-w-4xl mx-auto bg-white p-6 rounded shadow mt-2">
    
    <div class="flex flex-col md:flex-row justify-between items-start md:items-center mb-6 border-b pb-4 gap-2">
      <div>
        <h2 class="text-2xl font-bold text-blue-800">สร้างใบเสนอราคาประกันภัย</h2>
        <p class="text-xs text-gray-500">วันที่นำเสนอ: <span id="current-date"></span></p>
      </div>
      <span id="agent-info-display" class="text-sm text-gray-700 font-semibold bg-blue-50 px-3 py-1 rounded border border-blue-200"></span>
    </div>

    <!-- 1. ส่วนเลือกเงื่อนไขประกัน -->
    <div class="mb-6 p-4 bg-gray-50 rounded border no-print">
      <h3 class="font-bold mb-3 text-gray-800">1. เลือกแบบประกันและเงื่อนไขรถยนต์</h3>
      
      <div class="grid grid-cols-1 md:grid-cols-4 gap-3 mb-3">
        <!-- ประเภทประกัน -->
        <select id="ins-type" class="border p-2 rounded w-full">
          <option value="">-- ประเภทประกัน --</option>
          <option value="ป.1">ประเภท 1 (ป.1)</option>
          <option value="ป.2">ประเภท 2 (ป.2)</option>
          <option value="2+">ประเภท 2+ (2+)</option>
          <option value="3">ประเภท 3 (ป.3)</option>
          <option value="3+">ประเภท 3+ (3+)</option>
        </select>

        <!-- ประเภทรถ -->
        <select id="car-type" class="border p-2 rounded w-full">
          <option value="เก๋ง">รถเก๋ง</option>
          <option value="กระบะ">รถกระบะ</option>
          <option value="ตู้">รถตู้</option>
          <option value="อื่นๆ">อื่นๆ</option>
        </select>

        <!-- ทะเบียน กทม / ตจว -->
        <select id="car-location" class="border p-2 rounded w-full">
          <option value="กทม.">ป้ายทะเบียน กรุงเทพฯ</option>
          <option value="ต่างจังหวัด">ป้ายทะเบียน ต่างจังหวัด</option>
        </select>

        <!-- ทุนประกัน -->
        <input type="number" id="ins-sum-insured" placeholder="ทุนประกัน (บาท)" class="border p-2 rounded w-full">
      </div>

      <div class="grid grid-cols-1 md:grid-cols-3 gap-3 mb-3">
        <!-- บริษัทประกัน (ดึงจาก Google Sheet อัตโนมัติ) -->
        <select id="ins-company" class="border p-2 rounded w-full">
          <option value="">-- กำลังโหลดรายชื่อบริษัทฯ --</option>
        </select>

        <input type="text" id="ins-plan" placeholder="ระบุแผนประกัน (ถ้ามี)" class="border p-2 rounded w-full">
        
        <input type="number" id="ins-premium" placeholder="เบี้ยรวมสุทธิ (บาท)" class="border p-2 rounded w-full">
      </div>

      <button onclick="addCompare()" class="w-full bg-blue-600 text-white rounded p-2 font-semibold hover:bg-blue-700 transition">
        + เพิ่มเปรียบเทียบ
      </button>
    </div>

    <!-- 2. ตารางเปรียบเทียบ -->
    <div class="mb-6">
      <h3 class="font-bold mb-3 text-gray-800">2. ตารางเปรียบเทียบเบี้ยประกัน</h3>
      <div class="overflow-x-auto">
        <table class="w-full border-collapse border text-sm text-center bg-white">
          <thead>
            <tr class="bg-blue-100 text-blue-900">
              <th class="border p-2">บริษัท</th>
              <th class="border p-2">ประเภท / เงื่อนไข</th>
              <th class="border p-2">ทุนประกัน</th>
              <th class="border p-2">เบี้ยรวมสุทธิ</th>
              <th class="border p-2 text-red-600 agent-only">ค่าคอมฯ (%)</th>
              <th class="border p-2 text-red-600 agent-only">ค่าคอมฯ (บาท)</th>
              <th class="border p-2 no-print">จัดการ</th>
            </tr>
          </thead>
          <tbody id="compare-table-body">
            <tr id="empty-row"><td colspan="7" class="p-6 text-gray-400">ยังไม่มีข้อมูลเปรียบเทียบ</td></tr>
          </tbody>
        </table>
      </div>
    </div>

    <!-- 3. ข้อมูลลูกค้าและรถยนต์ -->
    <div class="mb-6 p-4 bg-gray-50 rounded border">
      <h3 class="font-bold mb-3 text-gray-800">3. ข้อมูลลูกค้าและรถยนต์</h3>
      <div class="grid grid-cols-1 md:grid-cols-3 gap-3">
        <input type="text" id="cust-name" placeholder="ชื่อผู้เอาประกันภัย" class="border p-2 rounded w-full">
        <input type="text" id="car-reg" placeholder="ทะเบียนรถ (เช่น ฎภ 1234 กทม)" class="border p-2 rounded w-full">
        <input type="text" id="car-model" placeholder="ยี่ห้อ / รุ่นรถ" class="border p-2 rounded w-full">
      </div>
    </div>

    <!-- ปุ่ม Action -->
    <div class="flex flex-col md:flex-row gap-3 mt-8 no-print">
      <button onclick="generatePDF()" class="w-full bg-red-500 text-white px-4 py-3 rounded font-bold shadow hover:bg-red-600">
        📄 ดาวน์โหลดใบเสนอราคา (PDF)
      </button>
      <button onclick="saveAndSendLINE()" class="w-full bg-green-500 text-white px-4 py-3 rounded font-bold shadow hover:bg-green-600">
        💬 บันทึกและส่ง Flex Message เข้า LINE
      </button>
    </div>
  </div>

  <script>
    let currentAgent = null;
    let currentUserLineId = "";
    const LIFF_ID = "2009043114-HC6s2Lkm"; 
    const GAS_API_URL = "https://script.google.com/macros/s/AKfycbzhLC4eCwMshx8BacjOr-4lY9eMKXc-Ilx_HB03Nx_0mxyM3drSnibQUy9jnjLNc0El/exec"; 

    window.onload = () => {
      const n = new Date();
      document.getElementById('current-date').innerText = `${n.getDate()}/${n.getMonth()+1}/${n.getFullYear()+543}`;

      liff.init({ liffId: LIFF_ID }).then(() => {
        if (!liff.isLoggedIn()) {
          liff.login();
        } else {
          liff.getProfile().then(profile => {
            currentUserLineId = profile.userId;
            checkAgentStatus(currentUserLineId);
          }).catch(err => alert("Error getting profile: " + err));
        }
      }).catch(err => alert("LIFF Init Error: " + err));
    };

    function checkAgentStatus(uid) {
      fetch(GAS_API_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
        body: JSON.stringify({ action: 'checkLogin', uid: uid })
      })
      .then(res => res.json())
      .then(result => {
        if(result.status === 'success') {
          if (result.data && result.data.status === 'Active') {
            currentAgent = result.data;
            document.getElementById('agent-info-display').innerText = `ตัวแทน: ${result.data.name} (ระดับ: ${result.data.level})`;
            loadCompanies(); // โหลดรายชื่อบริษัทจาก Sheet
          } else {
            document.getElementById('loading-section').innerHTML = '<h2 class="text-xl font-bold text-yellow-600">รอการอนุมัติสิทธิ์</h2>';
          }
        }
      });
    }

    // ฟังก์ชันดึงรายชื่อบริษัทมาใส่ Dropdown อัตโนมัติ
    function loadCompanies() {
      fetch(GAS_API_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
        body: JSON.stringify({ action: 'getMetadata' })
      })
      .then(res => res.json())
      .then(result => {
        if(result.status === 'success') {
          const select = document.getElementById('ins-company');
          select.innerHTML = '<option value="">-- เลือกบริษัทฯ ประกัน --</option>';
          result.companies.forEach(comp => {
            select.innerHTML += `<option value="${comp}">${comp}</option>`;
          });
          document.getElementById('loading-section').classList.add('hidden');
          document.getElementById('app-section').classList.remove('hidden');
        }
      });
    }

    function addCompare() {
      const type = document.getElementById('ins-type').value;
      const carType = document.getElementById('car-type').value;
      const location = document.getElementById('car-location').value;
      const sumInsured = document.getElementById('ins-sum-insured').value;
      const company = document.getElementById('ins-company').value;
      const plan = document.getElementById('ins-plan').value;
      const premium = document.getElementById('ins-premium').value;

      if(!type || !company || !premium) {
        alert("กรุณาเลือกประเภท บริษัท และกรอกเบี้ยประกันให้ครบถ้วน");
        return;
      }

      // ส่งเงื่อนไขทั้งหมดไปเช็คเรทค่าคอม
      fetch(GAS_API_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
        body: JSON.stringify({ 
          action: 'getCommRate', 
          company: company, 
          type: type, 
          carType: carType,
          location: location,
          level: currentAgent.level 
        })
      })
      .then(res => res.json())
      .then(result => {
        const rate = (result.status === 'success') ? result.rate : 0;
        const commAmount = (parseFloat(premium) * (rate / 100)).toFixed(2);

        const tbody = document.getElementById('compare-table-body');
        const emptyRow = document.getElementById('empty-row');
        if (emptyRow) emptyRow.remove();

        const tr = document.createElement('tr');
        tr.className = "border-b hover:bg-gray-50";
        tr.innerHTML = `
          <td class="border p-2">${company}</td>
          <td class="border p-2">${type} ${plan ? '('+plan+')' : ''}<br><span class="text-xs text-gray-500">${carType} / ${location}</span></td>
          <td class="border p-2">${sumInsured ? Number(sumInsured).toLocaleString() : '-'}</td>
          <td class="border p-2 font-semibold">${Number(premium).toLocaleString()}</td>
          <td class="border p-2 text-red-600 agent-only">${rate}%</td>
          <td class="border p-2 text-red-600 font-bold agent-only">${Number(commAmount).toLocaleString()}</td>
          <td class="border p-2 no-print">
            <button onclick="this.parentElement.parentElement.remove()" class="text-red-500 font-bold">X</button>
          </td>
        `;
        tbody.appendChild(tr);
        document.getElementById('ins-premium').value = '';
      });
    }

    function generatePDF() {
      const element = document.getElementById('app-section');
      document.querySelectorAll('.no-print, .agent-only').forEach(el => el.classList.add('hidden'));
      
      const opt = {
        margin: 0.3, filename: 'Quotation.pdf',
        image: { type: 'jpeg', quality: 0.98 },
        html2canvas: { scale: 2, useCORS: true },
        jsPDF: { unit: 'in', format: 'A4', orientation: 'portrait' }
      };

      html2pdf().set(opt).from(element).save().then(() => {
        document.querySelectorAll('.no-print, .agent-only').forEach(el => el.classList.remove('hidden'));
      });
    }

    function saveAndSendLINE() {
      const custName = document.getElementById('cust-name').value;
      const carReg = document.getElementById('car-reg').value;
      if(!custName || !carReg) return alert("กรุณากรอกชื่อลูกค้าและทะเบียนรถก่อนบันทึก");

      fetch(GAS_API_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
        body: JSON.stringify({ 
          action: 'saveQuote', 
          quoteData: { agentId: currentAgent.id, customerName: custName, carReg: carReg, agentLineUid: currentUserLineId } 
        })
      })
      .then(res => res.json())
      .then(result => {
        if(result.status === 'success') alert("บันทึกข้อมูลและส่ง Flex Message เข้ากลุ่มเรียบร้อยแล้ว!");
      });
    }
  </script>
</body>
</html>
