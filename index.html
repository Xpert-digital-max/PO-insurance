<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ระบบเสนอราคาเบี้ยประกัน</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
  <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
</head>
<body class="bg-gray-100 p-6">

  <!-- 1. หน้าโหลดดิ้ง -->
  <div id="loading-section" class="max-w-md mx-auto mt-20 text-center">
    <div class="animate-spin rounded-full h-12 w-12 border-b-2 border-blue-600 mx-auto mb-4"></div>
    <p class="text-gray-600 font-semibold" id="loading-text">กำลังเชื่อมต่อระบบรักษาความปลอดภัย...</p>
  </div>

  <!-- 2. หน้าฟอร์มลงทะเบียนตัวแทนใหม่ -->
  <div id="register-section" class="hidden max-w-md mx-auto bg-white p-6 rounded shadow mt-6">
    <h2 class="text-2xl font-bold mb-4 text-green-600">สมัครตัวแทนใหม่</h2>
    <p class="mb-4 text-sm text-gray-600">กรุณากรอกข้อมูลเพื่อรอแอดมินอนุมัติสิทธิ์</p>
    <input type="text" id="reg-name" placeholder="ชื่อ - นามสกุล" class="w-full border p-2 mb-3 rounded">
    <input type="tel" id="reg-phone" placeholder="เบอร์โทรศัพท์" class="w-full border p-2 mb-4 rounded">
    <button onclick="submitRegistration()" class="w-full bg-green-500 text-white p-2 rounded">ลงทะเบียน</button>
  </div>

  <!-- 3. หน้าจอรออนุมัติ -->
  <div id="pending-section" class="hidden max-w-md mx-auto bg-white p-6 rounded shadow mt-6 text-center">
    <h2 class="text-2xl font-bold mb-2 text-yellow-600">รอการอนุมัติ</h2>
    <p class="text-gray-700">ข้อมูลของคุณอยู่ในระบบแล้ว กรุณารอแอดมินเปิดสิทธิ์การใช้งาน (Active)</p>
  </div>

  <!-- 4. หน้าแอปพลิเคชันหลัก -->
  <div id="app-section" class="hidden max-w-4xl mx-auto bg-white p-6 rounded shadow mt-6">
    <div class="flex justify-between items-center mb-6 border-b pb-4">
      <h2 class="text-3xl font-bold">สร้างใบเสนอราคา</h2>
      <span id="agent-info-display" class="text-gray-600 font-semibold"></span>
    </div>
    
    <div class="grid grid-cols-2 gap-4 mb-6">
      <input type="text" id="cust-name" placeholder="ชื่อผู้เอาประกันภัย" class="border p-2 rounded">
      <input type="text" id="car-reg" placeholder="ทะเบียนรถ" class="border p-2 rounded">
    </div>
    <div class="flex gap-4 mb-4">
      <button class="bg-red-500 text-white px-4 py-2 rounded">📄 ดาวน์โหลด PDF</button>
      <button class="bg-green-500 text-white px-4 py-2 rounded">💬 ส่งเข้า LINE กลุ่ม</button>
    </div>
  </div>

  <script>
    let currentUserLineId = "";
    const LIFF_ID = "2009043114-HC6s2Lkm"; 
    // ⚠️ นำ Web App URL ที่ได้จาก GAS (ที่ลงท้ายด้วย /exec) มาใส่ตรงนี้
    const GAS_API_URL = "https://script.google.com/macros/s/AKfycbzhLC4eCwMshx8BacjOr-4lY9eMKXc-Ilx_HB03Nx_0mxyM3drSnibQUy9jnjLNc0El/exec"; 

    window.onload = () => {
      liff.init({ liffId: LIFF_ID }).then(() => {
        // เมื่อไม่ได้อยู่ใน Iframe ของ GAS คำสั่งนี้จะทำงานได้อย่างสมบูรณ์
        if (!liff.isLoggedIn()) {
          liff.login();
        } else {
          liff.getProfile().then(profile => {
            currentUserLineId = profile.userId;
            document.getElementById('loading-text').innerText = "กำลังดึงข้อมูลตัวแทน...";
            checkAgentStatus(currentUserLineId);
          }).catch(err => alert("Error getting profile: " + err));
        }
      }).catch(err => alert("LIFF Init Error: " + err));
    };

    function checkAgentStatus(uid) {
      // ใช้ Fetch API ยิงข้อมูลไปหา GAS แทน google.script.run
      fetch(GAS_API_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
        body: JSON.stringify({ action: 'checkLogin', uid: uid })
      })
      .then(response => response.json())
      .then(result => {
        if(result.status === 'success') {
          hideAllSections();
          if (result.data) {
            if (result.data.status === 'Active') {
              document.getElementById('app-section').classList.remove('hidden');
              document.getElementById('agent-info-display').innerText = `ตัวแทน: ${result.data.name} (ระดับ ${result.data.level})`;
            } else {
              document.getElementById('pending-section').classList.remove('hidden');
            }
          } else {
            document.getElementById('register-section').classList.remove('hidden');
          }
        } else {
          alert("Error จากเซิร์ฟเวอร์: " + result.message);
        }
      })
      .catch(error => alert("การเชื่อมต่อล้มเหลว: " + error));
    }

    function submitRegistration() {
      const name = document.getElementById('reg-name').value;
      const phone = document.getElementById('reg-phone').value;
      if(!name || !phone) return alert('กรุณากรอกข้อมูลให้ครบถ้วน');

      document.getElementById('register-section').innerHTML = '<p class="text-center mt-4 text-green-600 font-bold">กำลังบันทึกข้อมูล...</p>';

      fetch(GAS_API_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
        body: JSON.stringify({ 
          action: 'register', 
          formData: { name: name, phone: phone, uid: currentUserLineId } 
        })
      })
      .then(response => response.json())
      .then(result => {
        if(result.status === 'success') {
          hideAllSections();
          document.getElementById('pending-section').classList.remove('hidden');
        }
      });
    }

    function hideAllSections() {
      ['loading-section', 'register-section', 'pending-section', 'app-section'].forEach(id => {
        document.getElementById(id).classList.add('hidden');
      });
    }
  </script>
</body>
</html>
